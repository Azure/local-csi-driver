apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-annotations-to-pvcs
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["persistentvolumeclaims"]
  matchConditions:
  - name: annotation-is-missing
    expression: >-
      !has(object.metadata.annotations) ||
      !("localdisk.csi.acstor.io/accept-ephemeral-storage" in object.metadata.annotations)
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: >-
        Object{
          metadata: Object.metadata{
            annotations: {
              "localdisk.csi.acstor.io/accept-ephemeral-storage": "true"
            }
          }
        }
